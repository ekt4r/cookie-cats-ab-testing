[build-system]
requires = ['uv_build>=0.11,<0.12']
build-backend = 'uv_build'

[project]
name = "cookie-cats-ab-testing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[tool.uv.build-backend]
module-name = 'ab_testing'
